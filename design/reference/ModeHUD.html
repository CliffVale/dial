/* Dial kit styles. Every colour and timing comes from tokens.css. */
.dk-stage{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}

/* ---------- Dial ---------- */
.dk-dial{position:relative;width:260px;height:260px;outline:none;transform-origin:50% 0%;
  transition:opacity var(--dur-summon) var(--ease-out),transform var(--dur-summon) var(--ease-spring),filter var(--dur-summon) var(--ease-out)}

  transition-duration:var(--dur-dismiss);transition-timing-function:var(--ease-in)}
.dk-dial:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:50%}
.dk-svg{display:block;width:100%;height:100%;overflow:visible}
.dk-ringwrap{filter:drop-shadow(0 18px 26px rgba(0,0,0,.38))}
.dk-ring{fill:var(--ring);stroke:var(--ring);stroke-linejoin:round}
.dk-divider{stroke:var(--ring-divider);stroke-width:1}
.dk-active{transform-box:view-box;transform-origin:130px 130px;transition:transform var(--dur-detent) var(--ease-detent)}
.dk-active-fill{fill:var(--segment-active);stroke:var(--segment-active);stroke-linejoin:round}
.dk-hatch-line{fill:var(--segment-hatch)}
.dk-item{color:var(--icon-idle);transform-box:fill-box;transform-origin:center;
  transition:color 140ms ease,opacity 240ms var(--ease-out),transform 260ms var(--ease-spring)}
.dk-item.is-active{color:var(--icon-active)}
.dk-item.is-tick{animation:dk-tick var(--dur-detent) var(--ease-spring)}

.dk-dial.is-hidden .dk-item{opacity:0;transform:scale(.4);transition-delay:0ms!important}
.dk-hit{fill:#00000000;cursor:pointer}
.dk-well{fill:var(--ring-well)}
.dk-knob-enter{transform-box:view-box;transform-origin:130px 130px;transition:transform 460ms var(--ease-spring)}
.dk-dial.is-hidden .dk-knob-enter{transform:rotate(-90deg) scale(.8)}
.dk-knob-press{transform-box:view-box;transform-origin:130px 130px;cursor:pointer;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.38));
  transition:transform var(--dur-press-up) var(--ease-spring),filter var(--dur-press-up) var(--ease-out)}
.dk-dial.is-pressed .dk-knob-press{transform:scale(.92);filter:drop-shadow(0 2px 3px rgba(0,0,0,.38));
  transition-duration:var(--dur-press-down);transition-timing-function:var(--ease-in)}
.dk-knob-rot{transform-box:view-box;transform-origin:130px 130px;transition:transform var(--dur-detent) var(--ease-detent)}
.dk-knurl{fill:var(--knob-knurl)}
.dk-teeth{stroke:var(--knob-face);stroke-width:1.1}
.dk-face-a{stop-color:var(--knob-face)}
.dk-face-b{stop-color:var(--knob-shade)}
.dk-rim{fill:none;stroke:var(--knob-shade);stroke-width:1}
.dk-mark{stroke:var(--knob-ink);stroke-width:2;stroke-linecap:round}
.dk-knob-label{color:var(--knob-ink);transform-box:fill-box;transform-origin:center}
.dk-knob-label.is-swap{animation:dk-swap 180ms var(--ease-out)}
@keyframes dk-swap{0%{opacity:0;transform:translateY(4px) scale(.96)}100%{opacity:1;transform:none}}
.dk-knob-text{fill:var(--knob-ink);font:600 10px/1 var(--font-sans);letter-spacing:.02em;text-anchor:middle}
.dk-rimlight{fill:none;stroke:var(--glow);stroke-width:2;opacity:.55}
.dk-glow{fill:none;stroke:var(--glow);stroke-width:3;opacity:0;transform-box:view-box;transform-origin:130px 130px}
.dk-dial.is-glow .dk-glow{animation:dk-glow 560ms var(--ease-out)}
@keyframes dk-glow{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.24)}}
.dk-dial.is-glow .dk-active-fill{animation:dk-flash 360ms var(--ease-out)}

.dk-tether{fill:var(--glow)}
.dk-dial.is-fast .dk-active,.dk-dial.is-fast .dk-knob-rot{transition-duration:var(--dur-detent-fast);transition-timing-function:linear}
.dk-dial.is-moded .dk-active{opacity:.9}

/* ---------- HUD pill ---------- */
.dk-hud{display:inline-flex;align-items:center;gap:var(--space-2);height:34px;padding:0 14px 0 11px;box-sizing:border-box;
  border-radius:var(--radius-pill);background:var(--card);border:1px solid var(--card-border);box-shadow:var(--shadow-card);
  color:var(--ink);font:600 12px/16px var(--font-sans);white-space:nowrap;transform-origin:50% 0;
  transition:opacity var(--dur-hud) var(--ease-out),transform var(--dur-hud) var(--ease-spring)}
.dk-hud.is-hidden{opacity:0;transform:translateY(-8px) scale(.9);transition-timing-function:var(--ease-in)}
.dk-hud-icon{display:flex}
.dk-hud-meter{position:relative;width:72px;height:4px;border-radius:2px;background:var(--hairline);overflow:hidden}
.dk-hud-meter[hidden]{display:none}
.dk-hud-meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:2px;transition:width var(--dur-detent) var(--ease-out)}
.dk-hud-value{display:inline-block;font:500 12px/16px var(--font-mono);color:var(--ink-muted);min-width:24px;text-align:right}
.dk-hud-value.is-bump{animation:dk-bump 180ms var(--ease-spring)}
@keyframes dk-bump{45%{transform:translateY(-2px);color:var(--ink)}}

/* ---------- Review controls ---------- */
.dk-controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dk-chip{appearance:none;-webkit-appearance:none;border:1px solid var(--card-border);background:var(--card);color:var(--ink);
  font:500 12px/16px var(--font-sans);padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background 120ms ease,transform 120ms var(--ease-spring)}
.dk-chip:hover{background:var(--card-active)}
.dk-chip:active{transform:scale(.96)}
.dk-chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dk-chip kbd{font:500 11px/14px var(--font-mono);color:var(--ink-muted);margin-left:6px}
.dk-hintline{font:500 11px/14px var(--font-sans);color:var(--ink-muted);text-align:center;letter-spacing:.01em}

@media (prefers-reduced-motion:reduce){
  .dk-dial,.dk-active,.dk-knob-rot,.dk-knob-press,.dk-knob-enter,.dk-item,.dk-hud{transition-duration:1ms!important}
  .dk-item.is-tick,.dk-dial.is-glow .dk-glow,.dk-dial.is-glow .dk-active-fill,.dk-knob-label.is-swap,.dk-hud-value.is-bump{animation:none}
  .dk-dial.is-hidden{transform:none;filter:none}
}

      item: function () { return ITEMS[index]; },
      setModed: function (on) { moded = !!on; wrap.classList.toggle('is-moded', moded); if (!on) { knobAngle = angle; paint(); } },
      summon: function () { wrap.classList.remove('is-hidden'); },
      dismiss: function () { wrap.classList.add('is-hidden'); },
      hidden: function () { return wrap.classList.contains('is-hidden'); },
      on: function (name, fn) { (ev[name] = ev[name] || []).push(fn); return this; }
    };
  }

  /* HUD pill: icon, label, then a meter (levels) or a value (steps and lists). */
  function hud(host, opts) {
    opts = opts || {};
    var el = document.createElement('div');
    el.className = 'dk-hud is-hidden';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="dk-hud-icon"></span><span class="dk-hud-label"></span><span class="dk-hud-meter"><i></i></span><span class="dk-hud-value"></span>';
    host.appendChild(el);
    var timer = null, q = function (s) { return el.querySelector(s); };
    return {
      el: el,
      show: function (item, r, sticky) {
        q('.dk-hud-icon').innerHTML = icon(item.id, 16);
        q('.dk-hud-label').textContent = item.label;
        var m = q('.dk-hud-meter');
        if (r && r.frac != null) { m.hidden = false; m.firstChild.style.width = Math.round(r.frac * 100) + '%'; } else m.hidden = true;
        var v = q('.dk-hud-value'); v.textContent = r ? r.text : ''; restart(v, 'is-bump');
        el.classList.remove('is-hidden');
        clearTimeout(timer);
        if (!sticky && !opts.sticky) timer = setTimeout(function () { el.classList.add('is-hidden'); }, 1200);
      },
      hide: function () { el.classList.add('is-hidden'); }
    };
  }

  var APPS = ['Finder', 'Figma', 'Safari', 'Claude', 'Terminal', 'Notes', 'Mail', 'Music'];
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function cyc(v, a, b) { var n = b - a + 1; return ((v - a) % n + n) % n + a; }
  /* Fake system state so previews can show what a turn would do. */
  function sim() {
    var v = { volume: 56, brightness: 70, apps: 1, mission: 1, desktops: 2, tabs: 3, scroll: 0, undo: 0, slides: 4 };
    function read(id) {
      switch (id) {
        case 'volume': case 'brightness': return { text: String(v[id]), frac: v[id] / 100 };
        case 'apps': return { text: APPS[v.apps] };
        case 'mission': return { text: v.mission + ' / 6' };
        case 'desktops': return { text: v.desktops + ' / 4' };
        case 'tabs': return { text: v.tabs + ' / 8' };
        case 'scroll': return { text: v.scroll === 0 ? '—' : (v.scroll > 0 ? '↓ ' : '↑ ') + Math.abs(v.scroll) * 3 + ' lines' };
        case 'undo': return { text: v.undo < 0 ? 'Undo ×' + (-v.undo) : v.undo > 0 ? 'Redo ×' + v.undo : '—' };
        case 'slides': return { text: v.slides + ' / 24' };
      }
    }
    return {
      read: read,
      turn: function (id, d) {
        if (id === 'volume' || id === 'brightness') v[id] = clamp(v[id] + d * 6, 0, 100);
        else if (id === 'apps') v.apps = cyc(v.apps + d, 0, APPS.length - 1);
        else if (id === 'mission') v.mission = cyc(v.mission + d, 1, 6);
        else if (id === 'desktops') v.desktops = clamp(v.desktops + d, 1, 4);
        else if (id === 'tabs') v.tabs = cyc(v.tabs + d, 1, 8);
        else if (id === 'slides') v.slides = clamp(v.slides + d, 1, 24);
        else v[id] += d;
        return read(id);
      }
    };
  }

  /* Review controls: chips plus keys and the trackpad wheel standing in for the real dial. */
  function controls(host, target, h) {
    var row = document.createElement('div');
    row.className = 'dk-controls';
    [['Turn left', '←', function () { h.turn(-1); }], ['Press', 'space', function () { h.press(); }],
     ['Turn right', '→', function () { h.turn(1); }], ['Double press', 'D', function () { h.double && h.double(); }]]
      .forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'dk-chip'; b.type = 'button';
        b.innerHTML = c[0] + '<kbd>' + c[1] + '</kbd>';
        b.addEventListener('click', c[2]);
        row.appendChild(b);
      });
    host.appendChild(row);
    target.tabIndex = target.tabIndex < 0 ? 0 : target.tabIndex;
    target.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { h.turn(1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { h.turn(-1); e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter') { h.press(); e.preventDefault(); }
      else if (e.key === 'd' || e.key === 'D') { h.double && h.double(); }
    });
    var acc = 0;
    target.addEventListener('wheel', function (e) {
      e.preventDefault();
      acc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      while (Math.abs(acc) >= 36) { h.turn(acc > 0 ? 1 : -1); acc -= acc > 0 ? 36 : -36; }
    }, { passive: false });
    return row;
  }

  window.Dial = { ITEMS: ITEMS, APPS: APPS, ICON: ICON, geometry: G, segment: SEG, center: center, pt: pt,
    sector: sector, rsector: rsector, icon: icon, mount: mount, hud: hud, sim: sim, controls: controls };
})();
</script></head><body><!-- @dsCard group="Flows" height=240 subtitle="What a turn inside each mode looks like. Pick a mode, then turn" -->
<div class="dk-stage" id="stage" style="display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 16px 22px;min-height:220px;box-sizing:border-box;outline:none">
  <style>
    .modes{display:flex;gap:4px;padding:4px;border-radius:var(--radius-pill);background:var(--ring)}
    .modes button{appearance:none;-webkit-appearance:none;border:0;width:32px;height:32px;border-radius:50%;background:#00000000;color:var(--icon-idle);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 140ms ease,color 140ms ease}
    .modes button[aria-pressed="true"]{background:var(--segment-active);color:var(--icon-active)}
    .modes button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    #hudhost{height:36px;display:flex;align-items:center}
  </style>
  <div class="modes" id="modes" role="group" aria-label="Mode"></div>
  <div id="hudhost"></div>
  <div id="ctl"></div>
</div>
<script>
(function () {
  var stage = document.getElementById('stage'), row = document.getElementById('modes');
  var h = Dial.hud(document.getElementById('hudhost'), { sticky: true }), sim = Dial.sim(), mode = Dial.ITEMS[0];
  Dial.ITEMS.forEach(function (it) {
    var b = document.createElement('button');
    b.type = 'button'; b.title = it.label; b.setAttribute('aria-label', it.label);
    b.setAttribute('aria-pressed', it === mode ? 'true' : 'false');
    b.innerHTML = Dial.icon(it.id, 16);
    b.addEventListener('click', function () {
      mode = it;
      [].forEach.call(row.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      h.show(mode, sim.read(mode.id));
    });
    row.appendChild(b);
  });
  Dial.controls(document.getElementById('ctl'), stage, {
    turn: function (d) { h.show(mode, sim.turn(mode.id, d)); },
    press: function () { h.show(mode, { text: mode.press }); },
    double: function () { h.hide(); setTimeout(function () { h.show(mode, sim.read(mode.id)); }, 300); }
  });
  h.show(mode, sim.read(mode.id));
})();
</script>
